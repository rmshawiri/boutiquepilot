name: Android control APK
on:
  push:
    branches: [android/beta]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare exact embedded source
        run: |
          npm ci --no-audit --no-fund
          npm run sync
          npm run check
      - name: Build control APK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          cd android
          bash gradlew assembleDebug --no-daemon --max-workers=2 --console=plain
      - name: Verify signed APK and embedded assets
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/BoutiquePilot-Android-Beta-controle.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/BoutiquePilot-Android-Beta-controle.apk > artifacts/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/BoutiquePilot-Android-Beta-controle.apk > artifacts/package.txt
          python3 scripts/verify-apk.py artifacts/BoutiquePilot-Android-Beta-controle.apk
          sha256sum artifacts/BoutiquePilot-Android-Beta-controle.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BoutiquePilot-Android-Beta-controle
          path: mobile/artifacts/
          retention-days: 1
          if-no-files-found: error
